[package]
name = "engine"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
cpal = "0.18"
midir = "0.11"
rtrb = "0.4"
rustysynth = "1.3"
sdl3 = { version = "0.20", features = ["build-from-source-static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hound = "3.5"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_System_Threading"] }

[dev-dependencies]
hound = "3.5"
