[package]
name = "engine"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
cpal = "0.18"
midir = "0.11"
rtrb = "0.4"
rustysynth = "1.3"
sdl3 = { version = "0.20", features = ["build-from-source-static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
